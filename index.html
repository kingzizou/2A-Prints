<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2A FlowBooks has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://2aflowbooks.github.io/">
<meta http-equiv="refresh" content="3; url=https://2aflowbooks.github.io/">
<style>
  :root{--deep:#06241B;--gold:#F5B71A;--on:#EAF5EE;--muted:#9DBDAE}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--deep);color:var(--on);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px}
  main{max-width:520px;text-align:center}
  svg{width:72px;height:72px}
  h1{font-size:30px;line-height:1.15;margin:18px 0 10px;color:#fff}
  p{margin:0 0 14px;color:var(--muted)}
  a.btn{display:inline-block;margin-top:10px;padding:14px 24px;border-radius:999px;background:var(--gold);color:#2B1D00;font-weight:700;text-decoration:none}
  small{display:block;margin-top:22px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <!-- 2A FlowBooks gold mark (2A-FlowBooks-mark-gold.svg, unchanged) -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="gm" x1="60" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFD25A"/><stop offset=".55" stop-color="#F5B71A"/><stop offset="1" stop-color="#E39F0A"/></linearGradient></defs><path d="M256 70 L84 372 L428 372 Z" fill="url(#gm)" stroke="url(#gm)" stroke-width="64" stroke-linejoin="round"/><mask id="tri" maskUnits="userSpaceOnUse" x="-50" y="-50" width="612" height="612"><path d="M256 70 L84 372 L428 372 Z" fill="#fff" stroke="#fff" stroke-width="64" stroke-linejoin="round"/></mask><g mask="url(#tri)" fill="#06241B"><path d="M236 408 C 232 330 238 290 252 252 L 270 252 C 262 292 262 340 280 408 Z"/><path d="M261 150 L 296 252 L 226 252 Z" stroke="#06241B" stroke-width="10" stroke-linejoin="round"/></g></svg>
  <h1>2A Prints Accounting is now 2A FlowBooks</h1>
  <p>Our website has moved. Taking you there now&hellip;</p>
  <a class="btn" id="go" href="https://2aflowbooks.github.io/">Go to 2aflowbooks.github.io</a>
  <small>Same app, same company books and logins. Installed copies update themselves.</small>
</main>
<script>
  // Keep the part after # (e.g. #download, #pricing) so old links land on the right section.
  var url = "https://2aflowbooks.github.io/" + (location.hash || "");
  document.getElementById("go").href = url;
  setTimeout(function(){ location.replace(url); }, 1500);
</script>
</body>
</html>
